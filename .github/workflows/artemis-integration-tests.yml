# Manual only.
#
# This suite creates a course and an exercise on a live Artemis, submits code
# and waits for a result, then deletes the course. It is too slow and too
# stateful for every pull request, and CI here is deliberately functional tests
# only — those are what run automatically after a deploy to e2e-test.

name: Artemis Integration Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which EduIDE environment
        type: choice
        options: [e2e-test, test1, test2, test3, staging]
        default: e2e-test

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
      KEYCLOAK_PWD: ${{ secrets.KEYCLOAK_PWD }}
      LANDINGPAGE_URL: ${{ vars.LANDINGPAGE_URL }}
      ARTEMIS_URL: ${{ vars.ARTEMIS_URL }}
      ARTEMIS_USER: ${{ secrets.ARTEMIS_USER }}
      ARTEMIS_PWD: ${{ secrets.ARTEMIS_PWD }}
      NUM_INSTANCES: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --project=artemis --workers=1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
