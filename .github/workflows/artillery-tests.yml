name: Artillery Load Test

# Manual only: it opens real IDE sessions on a shared environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Landing page hostname to test
        type: string
        required: true
        default: e2e.eduide.student.k8s.aet.cit.tum.de
      num_instances:
        description: Number of virtual users
        type: string
        default: "5"

permissions:
  contents: read

# One run per environment at a time: all runs share the test user and its
# per-user session limit.
concurrency:
  group: eduide-https://${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  artillery:
    runs-on: ubuntu-24.04
    # Browsers come preinstalled, and their version is the one in package.json:
    # artillery's own Playwright is pinned to it with `overrides`.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
      KEYCLOAK_PWD: ${{ secrets.KEYCLOAK_PWD }}
      LANDINGPAGE_URL: https://${{ inputs.environment }}
      NUM_INSTANCES: ${{ inputs.num_instances }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      # artilleryio/action-cli@v1 runs a container whose entrypoint no longer
      # resolves (`/home/node/artillery/bin/run: not found`), so the step fails
      # regardless of the test. artillery is already a devDependency here, so
      # run it straight from node_modules and drop the broken action.
      - name: Execute load tests
        run: npx artillery run tests/ide/scalable/artillery/Artillery.ts
