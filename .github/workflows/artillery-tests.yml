name: Artillery Load Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  artillery:
    runs-on: ubuntu-latest
    env:
      KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
      KEYCLOAK_PWD: ${{ secrets.KEYCLOAK_PWD }}
      LANDINGPAGE_URL: ${{ vars.LANDINGPAGE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      # --with-deps runs apt-get update, which fails the whole job when
      # packages.microsoft.com returns 403 - it has nothing we need, and the
      # hosted runner image already carries the Playwright system libraries.
      - name: Drop unreachable apt sources
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # artilleryio/action-cli@v1 runs a container whose entrypoint no longer
      # resolves (`/home/node/artillery/bin/run: not found`), so the step fails
      # regardless of the test. artillery is already a devDependency here, so
      # run it straight from node_modules and drop the broken action.
      - name: Execute load tests
        run: npx artillery run tests/ide/scalable/artillery/Artillery.ts
