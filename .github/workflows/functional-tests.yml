name: Functional Theia Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # EduIDE-deployment calls this after it has deployed an environment, so the
  # suite runs against the rollout that just went green rather than against
  # whatever the repository variable happens to point at.
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: >-
          Landing page hostname to test, e.g.
          e2e.eduide.student.k8s.aet.cit.tum.de. In EduIDE-deployment the
          environment name and the landing page hostname are the same string,
          so the caller passes its environment name straight through.
      artemis_url:
        type: string
        required: false
        default: ''
        description: >-
          Artemis instance to integrate against, as a full URL, for example
          https://artemis.tum.de. Environments front different Artemis
          instances, so it belongs to the caller. Empty falls back to the
          ARTEMIS_URL repository variable.
    secrets:
      KEYCLOAK_USER:
        required: true
      KEYCLOAK_PWD:
        required: true
      # A called workflow can only read secrets it declares. The functional
      # project never touches Artemis, so these stay optional and simply stay
      # empty for a caller that does not have them.
      ARTEMIS_USER:
        required: false
      ARTEMIS_PWD:
        required: false
jobs:
  test:
    timeout-minutes: 60
    # Was `[self-hosted, e2e-test]`, which no registered runner answers to. The
    # only self-hosted runners in this org are two ARC scale sets on the student
    # cluster (`arc-buildkit-*-stud-amd64`), and an ARC scale-set runner is
    # addressed by its scale set name, never by `self-hosted`. Every run since
    # 2026-08-27 15:13 sat queued for that reason.
    #
    # The environments under test are reachable from the public internet - Let's
    # Encrypt validates their certificates over HTTP-01 - so a hosted runner
    # reaches them and needs no cluster access.
    runs-on: ubuntu-latest
    env:
      KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
      KEYCLOAK_PWD: ${{ secrets.KEYCLOAK_PWD }}
      # Called: test what the caller just deployed. Triggered directly: there is
      # no input, so keep using the repository variable as before.
      LANDINGPAGE_URL: ${{ inputs.environment && format('https://{0}', inputs.environment) || vars.LANDINGPAGE_URL }}
      # Configurable, so a caller can point the suite at its own Artemis.
      # Falls back to the repository variable when triggered directly.
      ARTEMIS_URL: ${{ inputs.artemis_url || vars.ARTEMIS_URL }}
      ARTEMIS_USER: ${{ secrets.ARTEMIS_USER }}
      ARTEMIS_PWD: ${{ secrets.ARTEMIS_PWD }}
      NUM_INSTANCES: 10

    steps:
      # In a called workflow the github context belongs to the CALLER, so a bare
      # checkout would clone the calling repository and leave no test suite to
      # run. job.workflow_repository / job.workflow_sha point at the repo and
      # commit this workflow file itself came from, which is what we want there.
      # inputs.environment is only set when we are called, so direct push and
      # pull_request runs keep checking out github.repository at github.sha
      # exactly as before.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.environment && job.workflow_repository || github.repository }}
          ref: ${{ inputs.environment && job.workflow_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --project=functional --workers=10
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
