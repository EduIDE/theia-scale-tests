# Functional and language tests against a deployed environment.
#
# Previously `runs-on: [self-hosted, e2e-test]`, a label no registered runner
# carried, so every run queued for 24 hours and was cancelled. The suite has
# therefore not actually executed since around March. These tests drive public
# HTTPS endpoints and need nothing cluster-local.

name: Functional tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Which EduIDE environment to test
        type: choice
        options: [e2e-test, test1, test2, test3, staging]
        default: e2e-test
  workflow_call:
    inputs:
      environment:
        type: string
        default: e2e-test
    secrets:
      KEYCLOAK_USER:
        required: true
      KEYCLOAK_PWD:
        required: true

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out the environment manifests
        uses: actions/checkout@v4
        with:
          repository: EduIDE/EduIDE-deployment
          path: .eduide-deployment

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve the target environment
        id: target
        env:
          EDUIDE_DEPLOYMENT: .eduide-deployment
        run: |
          set -euo pipefail
          env_name="${{ inputs.environment || 'staging' }}"
          url=$(./scripts/env-url.sh "$env_name")
          echo "environment=$env_name" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::testing $env_name at $url"

      - name: Run
        env:
          LANDINGPAGE_URL: ${{ steps.target.outputs.url }}
          KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
          KEYCLOAK_PWD: ${{ secrets.KEYCLOAK_PWD }}
        run: npx playwright test --project=functional --workers=4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ steps.target.outputs.environment }}
          path: playwright-report/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Functional tests"
            echo ""
            echo "Environment: \`${{ steps.target.outputs.environment }}\`"
            echo "URL: ${{ steps.target.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
