name: Scalable Theia Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Landing page hostname to test
        type: string
        required: true
        default: e2e.eduide.student.k8s.aet.cit.tum.de
permissions:
  contents: read

# One run per environment at a time: all runs share the test user and its
# per-user session limit.
concurrency:
  group: eduide-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      KEYCLOAK_USER: ${{ secrets.KEYCLOAK_USER }}
      KEYCLOAK_PWD: ${{ secrets.KEYCLOAK_PWD }}
      LANDINGPAGE_URL: https://${{ inputs.environment }}
      ARTEMIS_URL: ${{ vars.ARTEMIS_URL }}
      ARTEMIS_USER: ${{ secrets.ARTEMIS_USER }}
      ARTEMIS_PWD: ${{ secrets.ARTEMIS_PWD }}
      NUM_INSTANCES: ${{ vars.NUM_INSTANCES }}
      LOAD_TIMEOUT: ${{ vars.LOAD_TIMEOUT }}
      DETERMINISTIC: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --project=scale
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
